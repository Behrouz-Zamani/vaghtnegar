name: .NET build

on:
  push:
    branches:
      - main
      - feature/appointment-payment-flow
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore VaghtNegar.sln
      - name: Build
        run: dotnet build VaghtNegar.sln --no-restore --configuration Release
